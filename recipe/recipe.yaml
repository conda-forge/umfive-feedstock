schema_version: 1

context:
  name: umfive
  version: "0.5.0"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: 95a27e941cf40a25e1d1ea2693060b8eb1a919b853b192cd568b4e0932c2b2fe

build:
  number: 0
  skip:
    - win
    - match(python, "<3.11")
  script: ${{ PYTHON }} -m pip install . --no-deps -vv --no-build-isolation

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
  host:
    - python
    - pip
    - setuptools >=80
    - setuptools-scm >=8
    - numpy >=2
  run:
    - python
    - numpy >=2
    - cftime
    - pyfive >=1.3.1
    - xnetcdf

tests:
  - python:
      imports:
        - umfive
        - umfive._wgdos
      pip_check: true
  - files:
      source:
        - tests
    requirements:
      run:
        - fsspec
        - pip
        - pytest >8.0.0
        - pytest-xdist
        - python
    script:
      - pytest -n 2
      - umdump

about:
  homepage: https://pypi.org/project/umfive/
  license: MIT
  license_file: LICENSE
  summary: PP/Fields reader with pyfive-style high-level API
  description: PP/Fields reader with pyfive-style high-level API.

extra:
  recipe-maintainers:
    - davidhassell
    - valeriupredoi
